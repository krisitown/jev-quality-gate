schema_version: jev.policy/0.2
id: responsibility-entanglement
version: 0.1.0-exploratory
statement: Distinct responsibilities within a component should remain changeable without unnecessary cross-understanding or modification.
question: Does this change introduce or worsen coupling between distinct responsibilities within a component, such that changing one unnecessarily requires understanding or modifying the other?
scope:
  include:
    - "*.py"
    - "*.go"
    - "*.js"
    - "*.gjs"
    - "*.jsx"
    - "*.mjs"
    - "*.cjs"
    - "*.ts"
    - "*.gts"
    - "*.tsx"
    - "*.html"
    - "*.haml"
    - "*.erb"
    - "*.tmpl"
    - "*.graphql"
    - "*.java"
    - "*.kt"
    - "*.rs"
    - "*.rb"
    - "*.php"
    - "*.cs"
    - "*.c"
    - "*.h"
    - "*.cc"
    - "*.cpp"
    - "*.swift"
    - "*.scala"
    - "*.sql"
    - "*.vue"
    - "*.svelte"
  exclude:
    - "vendor/**"
    - "**/vendor/**"
    - "node_modules/**"
    - "**/node_modules/**"
    - "generated/**"
    - "**/generated/**"
  change_kind: introduced_or_worsened
interpretation:
  definitions:
    - The bound conventions define entanglement as evidenced coupling that makes a change to one distinct responsibility unnecessarily require understanding or modifying another.
    - Infer the responsibilities and their relationship from behavior, code paths, contracts, tests, and available dependency evidence.
    - For example, ranking and fee calculation can be distinct decisions in one component; if their branches share mutable mode or state so that changing ranking necessarily changes fee behavior, with no business invariant requiring that dependency, the change can show entanglement.
  exceptions:
    - Responsibilities may share a component when they form one coherent operation or contract, or when the evidence supports necessary coupling at an established boundary.
    - Size, method count, feature count, or co-location alone is not evidence of responsibility entanglement.
    - For example, separate helper methods are not entangled merely because they live in one file when evidence shows their changes are independent.
  ambiguity:
    - Available evidence does not establish distinct responsibilities or demonstrate that changes to one require understanding or modifying the other.
    - Search or graph evidence is incomplete, and no supported evidence request can establish the relevant cross-responsibility dependency.
outcomes: [compliant, violation, uncertain]
documents: [conventions]
aggregation:
  mode: requires_reconciliation
discovery:
  search_terms: [update, process, handle, save, notify, dispatch]
evidence:
  allowed_requests: [GET_DIFF_CHUNK, GET_FILE, SEARCH_CODE, GET_DOCUMENT, GET_CALLERS, GET_CALLEES]
  max_rounds: 3
  max_requests_per_round: 3
  max_input_tokens: 150000
  max_evidence_bytes: 80000
confidence:
  metric: selected_probability
  compliant_min: null
  violation_min: null
  request_selection_min: null
  support_min: null
  calibration_id: null
feedback:
  violation: Review the changed component for evidence that distinct responsibilities now require unnecessary cross-understanding or changes to one another.
  repair_guidance: Trace the changed behavior and its dependencies to establish which responsibilities are distinct and where their changes couple; separate the coupling only when that preserves the evidenced coherent contract.
ci:
  severity: warning
  compliant: report
  violation: report
  uncertain: report
