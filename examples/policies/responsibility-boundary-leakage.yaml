schema_version: jev.policy/0.2
id: responsibility-boundary-leakage
version: 0.2.0-exploratory
statement: A responsibility should not depend on another responsibility's internal procedure or representation without an evidenced need.
question: Does this change introduce or worsen a component's dependence on another responsibility's internal procedure or representation without a justified need?
scope:
  include:
    - "*.py"
    - "*.go"
    - "*.js"
    - "*.gjs"
    - "*.jsx"
    - "*.mjs"
    - "*.cjs"
    - "*.ts"
    - "*.gts"
    - "*.tsx"
    - "*.html"
    - "*.haml"
    - "*.erb"
    - "*.tmpl"
    - "*.graphql"
    - "*.java"
    - "*.kt"
    - "*.rs"
    - "*.rb"
    - "*.php"
    - "*.cs"
    - "*.c"
    - "*.h"
    - "*.cc"
    - "*.cpp"
    - "*.swift"
    - "*.scala"
    - "*.sql"
    - "*.vue"
    - "*.svelte"
  exclude:
    - "vendor/**"
    - "**/vendor/**"
    - "node_modules/**"
    - "**/node_modules/**"
    - "generated/**"
    - "**/generated/**"
  change_kind: introduced_or_worsened
interpretation:
  definitions:
    - The bound conventions define responsibility boundaries and apply them in every dependency direction, including between infrastructure components.
    - Infer responsibilities and internal versus contracted behavior from source, tests, interfaces, and stable contracts; explicit architecture documentation is optional.
    - For example, evidence that a service must sequence low-level save-parent, save-children, and flush procedures can show leakage of storage procedure even when those operations are technically public.
    - A business service that must sequence delete, positional insert, and flush calls to replace a collection may depend on storage procedure; a single provider-owned replace operation may preserve the boundary.
  exceptions:
    - Dependence through a supported stable contract is permitted when evidence shows the changed use stays within the contract and does not make the caller coordinate another responsibility's internal procedure or representation.
    - An adapter, translation layer, or necessary framework wiring may cross a boundary when evidence shows it preserves the boundary rather than exposing internal procedure or representation.
    - For example, using a documented `store.save(record)` operation can be compliant when the caller does not depend on storage ordering or representation.
  ambiguity:
    - Evidence does not establish which responsibility owns the referenced behavior or whether the accessed procedure or representation is internal or contracted.
    - Available relationship or source evidence is incomplete, and no supported evidence request can resolve the boundary or claimed need.
outcomes: [compliant, violation, uncertain]
documents: [conventions]
aggregation:
  mode: requires_reconciliation
discovery:
  search_terms: [internal, private, impl, adapter, repository, serialize, delete, insert, flush, storage]
evidence:
  allowed_requests: [GET_DIFF_CHUNK, GET_FILE, SEARCH_CODE, GET_DOCUMENT, GET_CALLERS, GET_CALLEES]
  max_rounds: 3
  max_requests_per_round: 3
  max_input_tokens: 150000
  max_evidence_bytes: 80000
confidence:
  metric: selected_probability
  compliant_min: null
  violation_min: null
  request_selection_min: null
  support_min: null
  calibration_id: null
feedback:
  violation: Review the changed dependency for access to another responsibility's internal procedure or representation, using evidence for both sides of the boundary.
  repair_guidance: Preserve the necessary behavior through the stable contract or an explicit adapter; remove reliance on the other responsibility's internal procedure or representation unless the evidence supports a specific exception.
ci:
  severity: warning
  compliant: report
  violation: report
  uncertain: report
